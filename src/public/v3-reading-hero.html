<!DOCTYPE html>
<!--
  v3-reading-hero.html
  Wix HtmlComponent: V3 bear-reading-on-stump autumn hero with scroll parallax.
  Futon Frames category hero. Receives {type:'scroll',scrollY:number} via postMessage.
  cf-e5de / Phase 7 V3 hero
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Hero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #F5C97A; }
    #root { width: 100%; height: 100%; }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Bear = () => {
  const fur = '#2A1810', furLight = '#4A2818', muzzle = '#A8806A',
        nose = '#1A0E08', cream = '#FAF2DE';
  return (
    <g>
      <ellipse cx="0" cy="62" rx="48" ry="6" fill={fur} opacity="0.18"/>
      <ellipse cx="0" cy="30" rx="38" ry="34" fill={fur}/>
      <ellipse cx="0" cy="40" rx="22" ry="20" fill={furLight} opacity="0.6"/>
      <ellipse cx="-22" cy="55" rx="14" ry="10" fill={fur}/>
      <ellipse cx="22" cy="55" rx="14" ry="10" fill={fur}/>
      <ellipse cx="-22" cy="58" rx="8" ry="4" fill={muzzle} opacity="0.5"/>
      <ellipse cx="22" cy="58" rx="8" ry="4" fill={muzzle} opacity="0.5"/>
      <ellipse cx="-30" cy="20" rx="10" ry="22" fill={fur} transform="rotate(-15 -30 20)"/>
      <ellipse cx="30" cy="20" rx="10" ry="22" fill={fur} transform="rotate(15 30 20)"/>
      <ellipse cx="0" cy="-12" rx="28" ry="26" fill={fur}/>
      <circle cx="-22" cy="-30" r="9" fill={fur}/>
      <circle cx="22" cy="-30" r="9" fill={fur}/>
      <circle cx="-22" cy="-30" r="5" fill={muzzle} opacity="0.7"/>
      <circle cx="22" cy="-30" r="5" fill={muzzle} opacity="0.7"/>
      <ellipse cx="0" cy="-2" rx="14" ry="11" fill={muzzle}/>
      <ellipse cx="0" cy="-8" rx="4" ry="3" fill={nose}/>
      <path d="M -4 -3 Q 0 0 4 -3" fill="none" stroke={nose} strokeWidth="1.5" strokeLinecap="round"/>
      {/* Eyes looking down at book */}
      <circle cx="-11" cy="-14" r="2.8" fill={nose}/>
      <circle cx="11" cy="-14" r="2.8" fill={nose}/>
      <circle cx="-10" cy="-15" r="0.8" fill={cream}/>
      <circle cx="12" cy="-15" r="0.8" fill={cream}/>
    </g>
  );
};

const HeroReading = () => {
  const [p, setP] = useState(0.3);
  const [t, setT] = useState(0);
  const leavesRef = useRef(null);

  if (!leavesRef.current) {
    leavesRef.current = Array.from({length: 40}).map((_, i) => ({
      x: (i*131)%1920, y0: -((i*53)%600),
      sp: 8 + (i%5)*4, sw: 0.6 + (i%4)*0.3, kind: i%3, rot: i*23,
    }));
  }

  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || e.data.type !== 'scroll') return;
      const scrollY = Number(e.data.scrollY) || 0;
      const heroH = 600, vh = window.innerHeight || 800;
      const raw = (heroH / 2 - scrollY - vh / 2) / vh;
      setP(Math.max(-1.2, Math.min(1.2, raw)));
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, []);

  useEffect(() => {
    let raf;
    const s = performance.now();
    const tick = (n) => { setT((n - s) / 1000); raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  const c = {
    sky1: '#F5C97A', sky2: '#E89F62', sun: '#FAE8B0', cream: '#FAF2DE',
    r1: '#3A1808', r2: '#6B2818', r3: '#A84818', r4: '#D87A3A', r5: '#F0A862',
    leaf1: '#D87A3A', leaf2: '#E8B848', leaf3: '#B8523A',
    book: '#5B3A2A', bookPages: '#FAF2DE', grass: '#6B4818',
  };
  const leafColors = [c.leaf1, c.leaf2, c.leaf3];

  return (
    <svg viewBox="0 0 1920 800" preserveAspectRatio="xMidYMid slice"
         style={{display:'block',width:'100%',height:'100%'}}
         role="img" aria-label="Bear reading a book on a stump amid autumn leaves">
      <defs>
        <linearGradient id="hr-sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={c.sky1}/><stop offset="100%" stopColor={c.sky2}/>
        </linearGradient>
        <filter id="hr-grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="13"/>
          <feColorMatrix values="0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.06  0 0 0 0.18 0"/>
        </filter>
      </defs>

      <rect width="1920" height="800" fill="url(#hr-sky)"/>
      <circle cx={1480 + p*20} cy={220 + p*30} r="200" fill={c.sun} opacity="0.4"/>
      <circle cx={1480 + p*20} cy={220 + p*30} r="68" fill={c.cream}/>

      {/* Autumn ridges */}
      <path d={`M 0 ${340+p*-10} Q 480 ${320+p*-10} 960 ${330+p*-10} T 1920 ${340+p*-10} L 1920 800 L 0 800 Z`} fill={c.r5}/>
      <path d={`M 0 ${410+p*-30} Q 480 ${380+p*-30} 960 ${395+p*-30} T 1920 ${410+p*-30} L 1920 800 L 0 800 Z`} fill={c.r4}/>
      <path d={`M 0 ${480+p*-55} Q 480 ${445+p*-55} 960 ${460+p*-55} T 1920 ${480+p*-55} L 1920 800 L 0 800 Z`} fill={c.r3}/>
      <path d={`M 0 ${550+p*-90} Q 480 ${510+p*-90} 960 ${525+p*-90} T 1920 ${545+p*-90} L 1920 800 L 0 800 Z`} fill={c.r2}/>
      <path d={`M 0 ${640+p*-80} Q 480 ${600+p*-80} 960 ${615+p*-80} T 1920 ${640+p*-80} L 1920 800 L 0 800 Z`} fill={c.grass}/>

      {/* Autumn pine trees */}
      <g transform={`translate(0 ${600+p*-80})`}>
        {[120,260,1640,1780].map((x,i)=>(
          <g key={i} transform={`translate(${x} 0) scale(${1.4 + (i%2)*0.4})`}>
            <rect x="-3" y="0" width="6" height="14" fill={c.r1}/>
            <polygon points="0,-60 -22,-30 22,-30" fill={c.r3}/>
            <polygon points="0,-40 -24,-10 24,-10" fill={c.r4}/>
            <polygon points="0,-18 -26,12 26,12" fill={c.r5}/>
          </g>
        ))}
      </g>

      {/* Bear reading on stump */}
      <g transform={`translate(960 ${720+p*-95})`}>
        {/* Stump */}
        <ellipse cx="0" cy="40" rx="180" ry="14" fill={c.r1} opacity="0.4"/>
        <rect x="-140" y="-10" width="280" height="50" fill={c.book} stroke={c.r1} strokeWidth="3" rx="4"/>
        <ellipse cx="0" cy="-10" rx="140" ry="18" fill={c.bookPages}/>
        {/* Bear sitting */}
        <g transform="translate(0 -90) scale(2)"><Bear/></g>
        {/* Open book on lap */}
        <g transform="translate(0 -30)">
          <ellipse cx="0" cy="6" rx="60" ry="6" fill={c.r1} opacity="0.3"/>
          <path d="M -56 -28 Q 0 -34 56 -28 L 56 4 Q 0 -2 -56 4 Z" fill={c.bookPages} stroke={c.r1} strokeWidth="2.5"/>
          <line x1="0" y1="-31" x2="0" y2="2" stroke={c.r1} strokeWidth="2"/>
          <g stroke={c.r1} strokeWidth="1.2" opacity="0.5" strokeLinecap="round">
            <line x1="-48" y1="-22" x2="-8" y2="-23"/>
            <line x1="-48" y1="-15" x2="-12" y2="-16"/>
            <line x1="-48" y1="-8" x2="-10" y2="-9"/>
            <line x1="8" y1="-23" x2="48" y2="-22"/>
            <line x1="12" y1="-16" x2="48" y2="-15"/>
            <line x1="10" y1="-9" x2="48" y2="-8"/>
          </g>
        </g>
      </g>

      {/* Falling leaves */}
      {leavesRef.current.map((l, i) => {
        const y = (l.y0 + t * l.sp + i * 40) % 1000 - 100;
        const x = l.x + Math.sin(t * 0.7 + i) * 18 + p * -15;
        const r = l.rot + t * 30;
        const col = leafColors[l.kind];
        return (
          <g key={i} transform={`translate(${x} ${y}) rotate(${r}) scale(${l.sw})`}>
            {l.kind === 0
              ? <path d="M 0 -8 Q 8 -8 8 0 Q 8 8 0 8 Q -8 8 -8 0 Q -8 -8 0 -8 Z" fill={col}/>
              : <ellipse rx="9" ry="4" fill={col}/>
            }
            <line x1="0" y1="0" x2="0" y2="-8" stroke="#3A2518" strokeWidth="0.6" opacity="0.6"/>
          </g>
        );
      })}

      <rect width="1920" height="800" filter="url(#hr-grain)" opacity="0.4"
            style={{mixBlendMode:'multiply'}} pointerEvents="none"/>
    </svg>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<HeroReading/>);
</script>
</body>
</html>
