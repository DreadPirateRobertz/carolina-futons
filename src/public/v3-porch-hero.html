<!DOCTYPE html>
<!--
  v3-porch-hero.html
  Wix HtmlComponent: V3 bear-on-porch sunrise hero with scroll-linked parallax.
  Receives {type:'scroll',scrollY:number} from parent via postMessage.
  cf-e5de / Phase 7 V3 hero
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porch Hero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #F5C97A; }
    #root { width: 100%; height: 100%; }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Bear (sitting pose) ───────────────────────────────────────────────
const Bear = ({ t }) => {
  const ink = '#2A1810', inkSoft = '#3A2518',
        fur = '#2A1810', furLight = '#4A2818', muzzle = '#A8806A',
        nose = '#1A0E08', cream = '#FAF2DE',
        mug = '#E8845C', mugDark = '#B8523A', steam = '#FAF2DE';
  return (
    <g>
      {/* Shadow */}
      <ellipse cx="0" cy="62" rx="48" ry="6" fill={ink} opacity="0.18"/>
      {/* Body */}
      <ellipse cx="0" cy="30" rx="38" ry="34" fill={fur}/>
      <ellipse cx="0" cy="40" rx="22" ry="20" fill={furLight} opacity="0.6"/>
      {/* Legs */}
      <ellipse cx="-22" cy="55" rx="14" ry="10" fill={fur}/>
      <ellipse cx="22" cy="55" rx="14" ry="10" fill={fur}/>
      <ellipse cx="-22" cy="58" rx="8" ry="4" fill={muzzle} opacity="0.5"/>
      <ellipse cx="22" cy="58" rx="8" ry="4" fill={muzzle} opacity="0.5"/>
      {/* Arms */}
      <ellipse cx="-30" cy="20" rx="10" ry="22" fill={fur} transform="rotate(-15 -30 20)"/>
      <ellipse cx="30" cy="20" rx="10" ry="22" fill={fur} transform="rotate(15 30 20)"/>
      {/* Head */}
      <ellipse cx="0" cy="-12" rx="28" ry="26" fill={fur}/>
      {/* Ears */}
      <circle cx="-22" cy="-30" r="9" fill={fur}/>
      <circle cx="22" cy="-30" r="9" fill={fur}/>
      <circle cx="-22" cy="-30" r="5" fill={muzzle} opacity="0.7"/>
      <circle cx="22" cy="-30" r="5" fill={muzzle} opacity="0.7"/>
      {/* Muzzle */}
      <ellipse cx="0" cy="-2" rx="14" ry="11" fill={muzzle}/>
      <ellipse cx="0" cy="-8" rx="4" ry="3" fill={nose}/>
      <path d="M -4 -3 Q 0 0 4 -3" fill="none" stroke={nose} strokeWidth="1.5" strokeLinecap="round"/>
      {/* Eyes */}
      <circle cx="-11" cy="-16" r="2.8" fill={nose}/>
      <circle cx="11" cy="-16" r="2.8" fill={nose}/>
      <circle cx="-10" cy="-17" r="0.8" fill={cream}/>
      <circle cx="12" cy="-17" r="0.8" fill={cream}/>
      {/* Mug in left paw */}
      <g transform="translate(-32 18)">
        <ellipse cx="0" cy="6" rx="8" ry="2" fill={mugDark}/>
        <rect x="-7" y="-6" width="14" height="12" fill={mug} stroke={mugDark} strokeWidth="1.2" rx="1"/>
        <path d="M 7 -2 q 5 0 5 4 q 0 4 -5 4" fill="none" stroke={mugDark} strokeWidth="1.2"/>
        <ellipse cx="0" cy="-6" rx="7" ry="1.5" fill={mugDark} opacity="0.5"/>
        {/* Steam */}
        <g opacity="0.7">
          <path d={`M -3 -10 q ${1+Math.sin(t*2)*1.2} -5 0 -10`} stroke={steam} strokeWidth="2" fill="none" strokeLinecap="round"/>
          <path d={`M 2 -10 q ${1+Math.sin(t*2+1)*1.2} -6 0 -12`} stroke={steam} strokeWidth="2" fill="none" strokeLinecap="round"/>
        </g>
      </g>
    </g>
  );
};

// ── Pine tree ─────────────────────────────────────────────────────────
const Pine = () => (
  <g>
    <rect x="-2" y="0" width="4" height="10" fill="#3A2518"/>
    <polygon points="0,-50 -16,-26 16,-26" fill="#1F3A2A"/>
    <polygon points="0,-32 -18,-8 18,-8" fill="#1F3A2A"/>
    <polygon points="0,-14 -20,8 20,8" fill="#1F3A2A"/>
  </g>
);

// ── Main scene ────────────────────────────────────────────────────────
const HeroPorch = () => {
  const [p, setP] = useState(0.3);
  const [t, setT] = useState(0);

  // Scroll parallax: parent sends {type:'scroll', scrollY}
  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || e.data.type !== 'scroll') return;
      const scrollY = Number(e.data.scrollY) || 0;
      const heroH = 600;
      const vh = window.innerHeight || 800;
      const raw = (heroH / 2 - scrollY - vh / 2) / vh;
      setP(Math.max(-1.2, Math.min(1.2, raw)));
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, []);

  // Time-based steam animation
  useEffect(() => {
    let raf;
    const s = performance.now();
    const tick = (n) => { setT((n - s) / 1000); raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  const c = {
    sky1: '#F5C97A', sky2: '#F0A882',
    sun: '#FAE8B0', cream: '#FAF2DE',
    r1: '#3A2518', r2: '#6B4D3A', r3: '#A8907A', r4: '#D4BBA0', r5: '#E8D5B7',
    porch: '#5B3A2A', porchLight: '#8B6E5A',
  };

  const porchY = 640 + p * -20;

  return (
    <svg viewBox="0 0 1920 800" preserveAspectRatio="xMidYMid slice"
         style={{display:'block',width:'100%',height:'100%'}}
         role="img" aria-label="Bear sipping coffee on a mountain porch at sunrise">
      <defs>
        <linearGradient id="ph-sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={c.sky1}/>
          <stop offset="100%" stopColor={c.sky2}/>
        </linearGradient>
        <filter id="ph-grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="3"/>
          <feColorMatrix values="0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.06  0 0 0 0.18 0"/>
        </filter>
      </defs>

      {/* Sky */}
      <rect width="1920" height="800" fill="url(#ph-sky)"/>

      {/* Sun halo */}
      <circle cx={1380 + p*30} cy={250 + p*40} r="220" fill={c.sun} opacity="0.45"/>
      <circle cx={1380 + p*30} cy={250 + p*40} r="78"  fill={c.cream}/>

      {/* Ridges — deeper layers move more with parallax */}
      <path d={`M 0 ${340+p*-10} Q 480 ${320+p*-10} 960 ${330+p*-10} T 1920 ${340+p*-10} L 1920 800 L 0 800 Z`} fill={c.r5}/>
      <path d={`M 0 ${410+p*-30} Q 480 ${380+p*-30} 960 ${395+p*-30} T 1920 ${410+p*-30} L 1920 800 L 0 800 Z`} fill={c.r4}/>
      <path d={`M 0 ${480+p*-55} Q 480 ${445+p*-55} 960 ${460+p*-55} T 1920 ${480+p*-55} L 1920 800 L 0 800 Z`} fill={c.r3}/>
      <path d={`M 0 ${550+p*-90} Q 480 ${510+p*-90} 960 ${525+p*-90} T 1920 ${545+p*-90} L 1920 800 L 0 800 Z`} fill={c.r2}/>

      {/* Porch railing */}
      <g transform={`translate(0 ${porchY})`}>
        <rect x="0" y="0" width="1920" height="20" fill={c.porch}/>
        <rect x="0" y="0" width="1920" height="6"  fill={c.porchLight}/>
        {Array.from({length: 24}).map((_, i) => (
          <rect key={i} x={i*82+20} y="20" width="6" height="60" fill={c.porch}/>
        ))}
        <rect x="0" y="80" width="1920" height="14" fill={c.porch}/>
      </g>

      {/* Foreground deck */}
      <rect x="0" y={720 + p*-10} width="1920" height="80" fill={c.porchLight}/>
      <g stroke={c.porch} strokeWidth="1.5" opacity="0.4">
        {[10, 40, 70].map((dy, i) => (
          <line key={i} x1="0" y1={720+dy+p*-10} x2="1920" y2={720+dy+p*-10}/>
        ))}
      </g>

      {/* Pine trees */}
      <g transform={`translate(${180 + p*-15} ${porchY - 6}) scale(2.4)`}><Pine/></g>
      <g transform={`translate(${1740 + p*15} ${porchY + 30}) scale(1.8)`}><Pine/></g>

      {/* Bear with coffee mug */}
      <g transform={`translate(960 ${680 + p*-12}) scale(2.2)`}>
        <Bear t={t}/>
      </g>

      {/* Birds drifting */}
      <g stroke={c.r1} strokeWidth="2.5" fill="none" strokeLinecap="round" opacity="0.7">
        <path d={`M ${(500 + (t*40)%2400 - 200) % 2400} 180 q 10 -6 20 0 q 10 -6 20 0`}/>
        <path d={`M ${(800 + (t*30)%2400 - 200) % 2400} 220 q 8 -5 16 0 q 8 -5 16 0`}/>
      </g>

      {/* Film grain overlay */}
      <rect width="1920" height="800" filter="url(#ph-grain)" opacity="0.35"
            style={{mixBlendMode:'multiply'}} pointerEvents="none"/>
    </svg>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<HeroPorch/>);
</script>
</body>
</html>
