name: CI

# Triggers: push/PR to main, plus nightly integration run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Nightly at 6am UTC (full integration suite)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Unit Tests ───────────────────────────────────────────────────────────────
  # Runs Vitest across Node 20 + 22 matrix. On Node 22: also collects coverage
  # locally (lcov + text). Coverage thresholds: statements 90%, branches 85%,
  # functions 88%, lines 91%.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high || true

      - name: Check for external repo import paths in tests
        run: |
          # CF-sdlo: Prevent imports from sibling repos (e.g. ../carolina-futons-stage3-velo/)
          # Tests must use vitest aliases (backend/*, public/*) or relative ../src/ paths.
          if grep -rn "from ['\"].*carolina-futons-stage3\|from ['\"].*carolina-futons-mobile" tests/ --include='*.js' --include='*.ts'; then
            echo "::error::Found external repo import paths in tests. Use vitest aliases or ../src/ relative paths instead."
            exit 1
          fi

      - name: Check for merge conflict markers (cf-i6xe)
        run: |
          # Fail if any JS/TS source file contains unresolved git conflict markers.
          # Catches the class of CI breakage caused by committed merge conflicts (e.g. 82a55a7d).
          node scripts/check-conflict-markers.mjs

      - name: Check for duplicate imports (CF-id8p)
        run: |
          # Fail if any JS/TS file has the same module imported twice.
          # Incident CF-2fs8: duplicate import blocked CI after a bad merge.
          node scripts/check-duplicate-imports.mjs

      - name: Check mock coverage (ratchet)
        run: node scripts/check-mock-coverage.mjs

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        if: matrix.node-version == 22
        run: npx vitest run --coverage

  # ── Lint ─────────────────────────────────────────────────────────────────────
  # ESLint on Node 20. Runs in parallel with test job. Fails fast on lint errors.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Lint
        run: npm run lint

  # ── Nightly Integration ──────────────────────────────────────────────────────
  # Full test suite with verbose + JUnit output + coverage in a single run.
  # On failure: auto-opens a GitHub issue tagged [bug, ci-nightly] with the
  # first 30 failed test lines + run URL.
  # Uploads test-results/ artifact (retained 30 days). Requires issues: write
  # permission for the failure-issue step.
  nightly-integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run full integration test suite with coverage
        id: integration
        run: |
          mkdir -p test-results
          npx vitest run --coverage --reporter=verbose --reporter=junit \
            --outputFile.junit=test-results/junit.xml 2>&1 | tee test-results/full-output.txt
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results
          path: test-results/
          retention-days: 30

      - name: Check for failures and create issue
        if: steps.integration.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            let output = '';
            try {
              output = readFileSync('test-results/full-output.txt', 'utf8');
            } catch (e) {
              output = 'Could not read test output.';
            }

            const failedLines = output.split('\n')
              .filter(l => l.includes('FAIL') || l.includes('×'))
              .slice(0, 30)
              .join('\n');

            const runUrl = [
              process.env.GITHUB_SERVER_URL,
              process.env.GITHUB_REPOSITORY,
              'actions/runs',
              process.env.GITHUB_RUN_ID,
            ].join('/');

            const today = new Date().toISOString().split('T')[0];

            const body = [
              '## Nightly Integration Test Failure',
              '',
              '**Date:** ' + today,
              '**Run:** ' + runUrl,
              '',
              '### Failed Tests',
              '```',
              failedLines || 'See full output in artifacts.',
              '```',
              '',
              '### Full Output',
              'Download the `nightly-test-results` artifact from the workflow run for complete details.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly integration tests failed — ' + today,
              body,
              labels: ['bug', 'ci-nightly'],
            });

      - name: Fail workflow if tests failed
        if: steps.integration.outcome == 'failure'
        run: exit 1

  # -- Element ID Sync Check (CF-p3ri) ------------------------------------------
  # Validates that element IDs declared in hookup-assistant/src/data/pages.ts
  # are referenced as $w('#id') selectors in the corresponding src/pages/*.js
  # file. Warning-only -- continue-on-error: true, never blocks merges.
  # Runs on PRs, nightly schedule, and manual dispatch.
  element-id-sync:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check element ID sync
        run: node scripts/check-element-id-sync.js
        continue-on-error: true

  # ── Hookup Assistant Tests (CF-iols) ─────────────────────────────────────
  # Runs vitest with coverage thresholds for the hookup-assistant package.
  # @wix/* packages are listed as optionalDependencies — npm skips them
  # gracefully when the private Wix registry is unavailable in CI.
  # All current tests stub @wix/editor via vi.mock — no Wix packages need
  # resolving at test time. If tests are added that import @wix/* without
  # mocks, --ignore-optional must be revisited.
  hookup-assistant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/hookup-assistant

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/hookup-assistant/package-lock.json

      - name: Install dependencies (skip optional @wix/* packages)
        run: npm ci --ignore-optional --ignore-scripts

      - name: Run hookup-assistant tests with coverage thresholds
        run: npx vitest run --coverage --config vitest.config.ts

  # ── E2E Smoke Tests ─────────────────────────────────────────────────────
  # Puppeteer smoke tests against the staging site.
  # Validates: HTTP 200, CF branding, category pages load, no 404s.
  # Runs nightly + on-demand — avoids blocking PRs on external-network flakiness.
  e2e-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # Non-blocking: staging pages not yet wired in editor
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://halworker85.wixstudio.com/my-site
