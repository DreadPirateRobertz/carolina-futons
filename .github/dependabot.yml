# Dependabot — automated dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/New_York
    labels:
      - dependencies
    open-pull-requests-limit: 10
    rebase-strategy: auto
    groups:
      # Group dev-dependency bumps into a single PR
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Security patches always get their own PR (ungrouped)
    # Ignore major bumps only for known-stable packages that haven't updated their
    # transitive deps to support new major versions. Remove a package from this list
    # once the parent dep is known to support the new major.
    #
    # Note: @wix/cli@1.x transitively requires node-gyp@8 → tar@^6 (CVEs open).
    # Wix has not yet released a @wix/cli version that uses node-gyp@12 (tar@^7).
    # Until then, the tar vulnerabilities remain open — the npm overrides in
    # package.json pin tar@^7.5.12 to suppress the advisory scanner.
    ignore:
      - dependency-name: "@wix/cli"
        update-types:
          - version-update:semver-major
      - dependency-name: "@wix/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "vite"
        update-types:
          - version-update:semver-major
      - dependency-name: "vitest"
        update-types:
          - version-update:semver-major
